version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "*"
    schedule:
      interval: "weekly" # daily is redundant given the 7-day cooldown below
    cooldown:
      default-days: 7 # avoids PRs for versions that are too new to be stable
    ignore:
      # minor bumps to internal MoJ actions are low-risk and high-noise; patches still flow through for security fixes
      - dependency-name: "ministryofjustice/hmpps-github-actions/*"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "ministryofjustice/hmpps-github-shared-actions/*"
        update-types:
          - "version-update:semver-minor"
    groups:
      minor-patch: # auto-mergeable: low risk
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

      major: # manual review required: breaking changes possible
        patterns:
          - "*"
        update-types:
          - "major"
      bumps: # manual catch-all for any other updates that don't match the above groups
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "*" # covers all image subdirectories
    groups:
      minor-patch: # auto-mergeable: low risk
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      major: # manual review required: breaking changes possible
        patterns:
          - "*"
        update-types:
          - "major"

      bumps: # manual catch-all for any other updates that don't match the above groups
        patterns:
          - "*"

    schedule:
      interval: "weekly" # daily is redundant given the 7-day cooldown below
    cooldown:
      default-days: 7 # avoids PRs for versions that are too new to be stable

  - package-ecosystem: "npm" # detects pinned npm versions inside node Dockerfiles
    directories:
      - "*"
    groups:
      minor-patch: # auto-mergeable: low risk
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      major: # manual review required: breaking changes possible
        patterns:
          - "*"
        update-types:
          - "major"
      bumps: # manual catch-all for any other updates that don't match the above groups
        patterns:
          - "*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "pip" # detects pinned pip versions inside python Dockerfiles
    directories:
      - "*"
    groups:
      minor-patch: # auto-mergeable: low risk
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

      major: # manual review required: breaking changes possible
        patterns:
          - "*"
        update-types:
          - "major"
      bumps: # manual catch-all for any other updates that don't match the above groups
        patterns:
          - "*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
