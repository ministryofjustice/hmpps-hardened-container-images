version: 2
multi-ecosystem-groups:
  infrastructure:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "github-actions"
    multi-ecosystem-group: "infrastructure"
    directory: "/"  # Location of workflow files
    patterns: ["*"]
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    multi-ecosystem-group: "infrastructure"
    patterns: ["*"]
    directories:
      - "/images/java/distroless"
      - "/images/java/eclipse-temurin"
      - "/images/node/alpine"
      - "/images/node/alpine-runtime"
      - "/images/node/distroless"
      - "/images/python/alpine"
    cooldown:
      default-days: 7
