name: Backup Repository to SharePoint

on:
  workflow_dispatch: # manual trigger
  schedule:
    - cron: '15 1 * * *'

permissions:
  contents: read

jobs:
  backup:
    name: Backup to SharePoint
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/backup_repository.yml@2f477d94de98edf4c481ff948624118c3fc93e5a
    with:
      retention_count: 5 # optional, defaults to 5
    secrets:
      SHAREPOINT_CLIENT_ID: ${{ secrets.SHAREPOINT_CLIENT_ID }}
      SHAREPOINT_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
