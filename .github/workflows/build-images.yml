name: Build Hardened Container Images
permissions:
  contents: read

on:
  push:
    tags:
      - '*'
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.head_ref || github.ref_name }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  DevSecOps:
    uses: ./.github/workflows/DevSecOps.yml
    secrets:
      HMPPS_RELEASE_PLEASE_CLIENT_ID: ${{ secrets.HMPPS_RELEASE_PLEASE_CLIENT_ID }}
      HMPPS_RELEASE_PLEASE_KEY: ${{ secrets.HMPPS_RELEASE_PLEASE_KEY }}
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      id-token: write
      contents: read
  build-scan-push:
    # needs: DevSecOps
    name: Build-Scan-Push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SNYK_TOKEN: ${{ secrets.HMPPS_SNYK_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: hardened-eclipse-temurin-java21
            context: images/java/eclipse-temurin
            dockerfile: images/java/eclipse-temurin/Dockerfile.java21
            tag_prefix: ''
            publish_latest: false
          - image_name: hardened-eclipse-temurin-java25
            context: images/java/eclipse-temurin
            dockerfile: images/java/eclipse-temurin/Dockerfile.java25
            tag_prefix: ''
            publish_latest: true
          - image_name: hardened-distroless-java21
            context: images/java/distroless
            dockerfile: images/java/distroless/Dockerfile.java21
            tag_prefix: ''
            publish_latest: false
          - image_name: hardened-distroless-java25
            context: images/java/distroless
            dockerfile: images/java/distroless/Dockerfile.java25
            tag_prefix: ''
            publish_latest: true
          - image_name: hardened-alpine-node-24
            context: images/node/alpine
            dockerfile: images/node/alpine/Dockerfile.node24-npm11
            tag_prefix: ''
            publish_latest: false
          - image_name: hardened-alpine-node-runtime-24
            context: images/node/alpine-runtime
            dockerfile: images/node/alpine-runtime/Dockerfile
            tag_prefix: ''
            publish_latest: true
          - image_name: hardened-alpine-node-runtime-24-apko
            context: images/node/alpine-runtime
            apko_config: images/node/alpine-runtime/apko.yaml
            tag_prefix: ''
            publish_latest: true
          - image_name: hardened-distroless-node-24
            context: images/node/distroless
            dockerfile: images/node/distroless/Dockerfile
            publish_latest: true
          - image_name: hardened-python-alpine-3-13
            context: images/python/alpine
            dockerfile: images/python/alpine/Dockerfile
            tag_prefix: ''
            publish_latest: true
    permissions:
      packages: write
      security-events: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sanitise Tag Name
        id: snyk_image
        run: |
          TAG=$(echo "${{ env.IMAGE_TAG }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's|[^a-z0-9.-]|-|g' \
            | cut -c1-100
          )
          TAG=$(echo "$TAG" | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]')
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/hmpps-${{ matrix.image_name }}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/hmpps-${{ matrix.image_name }}
          tags: |
            type=raw,value=${{ steps.snyk_image.outputs.image_tag }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        if: ${{ !matrix.apko_config }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          # tag/scheduled builds publish multi-arch images and push to GHCR;
          # main and PR builds stay amd64-only and are loaded locally for Snyk scanning
          # (buildx --load does not support multi-platform manifests).
          platforms: ${{ (github.ref_type == 'tag' || github.event_name == 'schedule') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          pull: true
          sbom: ${{ github.ref_type == 'tag' || github.event_name == 'schedule' }}
          provenance: ${{ github.ref_type == 'tag' || github.event_name == 'schedule' }}
          push: true
            # ${{ github.ref_type == 'tag' || github.event_name == 'schedule' }}
          load: ${{ !(github.ref_type == 'tag' || github.event_name == 'schedule') }}
          # main/scheduled builds use metadata-action tags and push to GHCR.
          # PR builds use a local-only snyk-scan:* tag (not pushed) for container scanning.
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: security-upgrades

      - name: Build and push apko image
        if: ${{ matrix.apko_config }}
        env:
          APKO_CONFIG: ${{ matrix.apko_config }}
          APKO_IMAGE_REF: ${{ steps.snyk_image.outputs.image_ref }}
          APKO_ARCHES: 'x86_64,arm64,amd64'
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/$APKO_CONFIG" ]; then
            echo "::error file=$APKO_CONFIG::Apko configuration is missing from the checkout. Ensure it is committed."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/apko-sbom"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --volume "$RUNNER_TEMP/apko-sbom:/sbom" \
            --volume "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
            --workdir /work \
            cgr.dev/chainguard/apko@sha256:20ac78c9ccfd679a31a5c4e7c93b5861504ca0768d2ad60cc7fadb5933f7db37 \
            publish \
            --arch "$APKO_ARCHES" \
            --sbom-path /sbom \
            "$APKO_CONFIG" \
            "$APKO_IMAGE_REF"

      - name: Snyk scan
        id: snyk-scan
        uses: ministryofjustice/hmpps-github-shared-actions/.github/actions/snyk-scan@2848496f6e2f4144b17fd3f23519c851789e4b87
        with:
          subproject: ${{ matrix.dockerfile || matrix.apko_config }}
          severity: high
          scan_type: image
          location: '.'
          snyk_policy_path: ''
          github_token: ${{ secrets.GITHUB_TOKEN }}
          snyk_token: ${{ secrets.HMPPS_SNYK_API_KEY }}
          image_ref: ${{ steps.snyk_image.outputs.image_ref }}

      # - name: Snyk slack notification
      #   uses: ministryofjustice/hmpps-github-shared-actions/.github/actions/slack_snyk_scan_notification@35bb5e74a025299cddf50909c1968444d966c1dc
      #   if: (failure() || steps.snyk-scan.outcome == 'failure' || fromJSON(steps.snyk-scan.outputs.results_count || '0') > 0) && (vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK') != 'NO_SLACK'
      #   with:
      #     title: 'Snyk'
      #     warningOnly: ${{ steps.snyk-scan.outputs.sarif_upload_outcome == 'success' }}
      #     channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
      #     SLACK_BOT_TOKEN: ${{ secrets.HMPPS_SRE_SLACK_BOT_TOKEN }}
      #     subproject: ''
      #     scan_context: image-${{ github.ref_name }}
      #     image_ref: ${{ steps.snyk_image.outputs.image_ref }}
      #     summary: ${{ steps.snyk-scan.outputs.summary }}
