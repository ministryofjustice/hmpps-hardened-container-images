accounts:
  groups:
    - groupname: appgroup
      gid: 2000
  users:
    - username: appuser
      uid: 2000
      shell: /sbin/nologin
      homedir: /dev/null
  run-as: root

entrypoint:
  command: node

work-dir: /app

environment:
  GOTOOLCHAIN: local
  NODE_ENV: production
  TZ: Europe/London

paths:
  - path: /app
    type: directory
    uid: 2000
    gid: 2000
    permissions: 0o755
  - path: /etc/localtime
    type: symlink
    source: /usr/share/zoneinfo/Europe/London

annotations:
  org.opencontainers.image.title: HMPPS Node.js Runtime Base Image
  org.opencontainers.image.description: Runtime-only container image for HMPPS Node.js applications with Node.js package managers excluded and apk available
  org.opencontainers.image.source: https://github.com/ministryofjustice/hmpps-hardened-container-images
  org.opencontainers.image.vendor: Ministry of Justice
  org.opencontainers.image.base.name: alpine:3.24
  hmpps.node.base_image: node
  hmpps.node.base_variant: 24-alpine3.24
